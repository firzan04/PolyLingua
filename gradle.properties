# Gradle daemon sizing: CI runners have 16 GB RAM; local PCs usually 8+ GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# Room schema export + KSP incremental
ksp.incremental=true

# ---- PolyLingua build switches -------------------------------------------------------------
# NDK used for llama.cpp / JNI bridges (r27c LTS). r26b (26.1.10909125) also works.
polylingua.ndkVersion=27.2.12479018
# R8 minification. Off by default: JNI callbacks + WebRTC reflection make an unshrunk build the
# safest production default. Pass -Ppolylingua.minify=true to enable (keep rules are provided).
polylingua.minify=false
